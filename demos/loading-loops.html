<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading Loops</title>
<link rel="stylesheet" href="../mtx/css/tokens.css">
<style>
  /* 8 infinite-loop loading options in the MTX theme. Mockup only, not wired into any screen.
     Every loop animates transform / opacity only, ends where it starts, and calms down under prefers-reduced-motion. */
  :root { --ink: #101318; --panel: #16181f; --line: #2a2d38; --p1: #f3eed0; --p2: #e4b996; --p3: #766ab2; --p4: #5a8dc2; --p5: #8bcab2;
    --conic: conic-gradient(from 0deg, var(--p1), var(--p2), var(--p3), var(--p4), var(--p5), var(--p1)) }
  * { box-sizing: border-box }
  html, body { margin: 0; background: var(--ink); color: var(--text-1); font: 500 15px/1.3 var(--font-ui) }
  main { max-width: 1320px; margin: 0 auto; padding: 24px 16px 40px }
  h1 { margin: 0; font: 700 26px/1 var(--font-ui); text-transform: uppercase; letter-spacing: .06em }
  .sub { margin: 8px 0 20px; color: var(--text-muted) }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, 1fr) } }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr } }
  .card { background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); display: flex; flex-direction: column }
  .stage { position: relative; height: 210px; display: grid; place-items: center; background: #0c0e13; overflow: hidden }
  .meta { padding: 12px 14px 14px; display: grid; gap: 4px }
  .meta b { font: 700 14px/1.1 var(--font-ui); letter-spacing: .08em; text-transform: uppercase }
  .meta b i { font-style: normal; color: var(--text-muted); margin-right: 6px }
  .meta span { color: var(--text-muted); font-size: 13px }
  .mini { display: flex; align-items: center; gap: 10px; margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--line);
    font: 600 12px/1 var(--font-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--text-2) }
  .mini .box { position: relative; width: 40px; height: 40px; flex: none }
  .mini .box > .sc:has(.inf) { transform: translate(-50%, -50%) scale(.2) }
  .mini .box > .sc { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.3) }

  /* shared: a diamond ring with a prismatic edge (mask trick, square corners) */
  .ring { position: absolute; padding: 3px; transform: rotate(45deg);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude }

  /* A. Prismatic infinity: dim track + a comet of diamonds running the figure-eight */
  .inf { position: relative; width: 200px; height: 100px }
  .inf svg { position: absolute; inset: 0; overflow: visible }
  .inf .dot { position: absolute; left: 0; top: 0; width: 10px; height: 10px; background: var(--c);
    offset-path: path("M100,50 C130,12 178,12 178,50 C178,88 130,88 100,50 C70,12 22,12 22,50 C22,88 70,88 100,50 Z");
    offset-rotate: 45deg; animation: infRun 2.4s linear infinite; animation-delay: calc(var(--i) * -.1s); opacity: calc(1 - var(--i) * .14); scale: calc(1 - var(--i) * .1) }
  @keyframes infRun { from { offset-distance: 0% } to { offset-distance: 100% } }

  /* B. Diamond ring turn: prismatic ring turns 90deg per beat, inner diamond breathes */
  .turn { position: relative; width: 120px; height: 120px }
  .turn .ring { inset: 18px; background: var(--grad-focus); animation: turn 2.4s cubic-bezier(.7, 0, .3, 1) infinite }
  .turn .core { position: absolute; inset: 47px; background: var(--p1); transform: rotate(45deg); animation: breathe 1.2s ease-in-out infinite }
  @keyframes turn { 0% { transform: rotate(45deg) } 25% { transform: rotate(135deg) } 50% { transform: rotate(225deg) } 75% { transform: rotate(315deg) } 100% { transform: rotate(405deg) } }
  @keyframes breathe { 0%, 100% { transform: rotate(45deg) scale(.55); opacity: .5 } 50% { transform: rotate(45deg) scale(1); opacity: 1 } }

  /* C. Diamond pulse chain: five diamonds, a wave runs left to right */
  .chain { display: flex; gap: 14px }
  .chain i { width: 16px; height: 16px; background: var(--c); transform: rotate(45deg) scale(.55); opacity: .25;
    animation: chain 1.4s ease-in-out infinite; animation-delay: calc(var(--i) * .14s) }
  @keyframes chain { 0%, 60%, 100% { transform: rotate(45deg) scale(.55); opacity: .25 } 25% { transform: rotate(45deg) scale(1); opacity: 1 } }

  /* D. Slanted bar chase: seven slanted blades light up in turn (a chase, not a fill) */
  .blades { display: flex; gap: 6px }
  .blades i { width: 10px; height: 40px; background: var(--c); transform: skewX(-22deg); opacity: .18;
    animation: blade 1.4s linear infinite; animation-delay: calc(var(--i) * .1s) }
  @keyframes blade { 0%, 100% { opacity: .18 } 12% { opacity: 1 } 45% { opacity: .18 } }

  /* E. Flower Thai spin: the loadout Flower Thai tile as a prismatic silhouette, slow quarter turns + halo ring */
  .flower { position: relative; width: 130px; height: 130px }
  .flower .bloom { position: absolute; inset: 0; background: var(--conic);
    -webkit-mask: url(../mtx/assets/svg/loadout/flower-thai-tile.svg) center / 100% 100% no-repeat; mask: url(../mtx/assets/svg/loadout/flower-thai-tile.svg) center / 100% 100% no-repeat;
    animation: bloom 3.2s cubic-bezier(.6, 0, .4, 1) infinite }
  .flower .halo { position: absolute; inset: 22px; border: 1px solid var(--p1); transform: rotate(45deg); opacity: 0; animation: halo 1.6s ease-out infinite }
  @keyframes bloom { 0% { transform: rotate(0) } 50% { transform: rotate(90deg) } 100% { transform: rotate(180deg) } }
  @keyframes halo { 0% { transform: rotate(45deg) scale(.6); opacity: .9 } 100% { transform: rotate(45deg) scale(1.35); opacity: 0 } }

  /* F. Quatrefoil orbit: four diamonds orbit a hollow centre, stepping a quarter turn */
  .orbit { position: relative; width: 120px; height: 120px; animation: turn0 2s cubic-bezier(.7, 0, .3, 1) infinite }
  .orbit i { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px; background: var(--c);
    transform: rotate(calc(var(--i) * 90deg)) translateY(-40px) rotate(45deg); animation: orbitPop 1s ease-in-out infinite; animation-delay: calc(var(--i) * -.25s) }
  .orbit .hub { position: absolute; inset: 48px; border: 2px solid var(--text-1); transform: rotate(45deg) }
  @keyframes turn0 { 0% { transform: rotate(0) } 50% { transform: rotate(90deg) } 100% { transform: rotate(180deg) } }
  @keyframes orbitPop { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }

  /* G. Nested diamonds: three prismatic rings, outer and middle turn opposite ways, inner pulses */
  .nest { position: relative; width: 130px; height: 130px }
  .nest .ring { background: var(--grad-focus) }
  .nest .r1 { inset: 20px; animation: turn 3.2s cubic-bezier(.7, 0, .3, 1) infinite }
  .nest .r2 { inset: 38px; animation: turnBack 3.2s cubic-bezier(.7, 0, .3, 1) infinite; animation-delay: -.4s }
  .nest .r3 { inset: 55px; padding: 0; background: var(--p1); -webkit-mask: none; mask: none; animation: breathe 1.6s ease-in-out infinite }
  @keyframes turnBack { 0% { transform: rotate(45deg) } 25% { transform: rotate(-45deg) } 50% { transform: rotate(-135deg) } 75% { transform: rotate(-225deg) } 100% { transform: rotate(-315deg) } }

  /* H. Diamond trace: a prismatic light runs round a still diamond track (the Loadout focus ring shape) */
  .trace { position: relative; width: 120px; height: 120px }
  .trace .track { position: absolute; inset: 22px; border: 3px solid #2a2d38; transform: rotate(45deg) }
  .trace .ring { inset: 21px; padding: 5px; overflow: hidden }
  .trace .ring::before { content: ""; position: absolute; inset: -50%;
    background: conic-gradient(from 0deg, transparent 0 50%, var(--p3) 62%, var(--p4) 74%, var(--p5) 86%, var(--p2) 94%, var(--p1) 99%, transparent 99%);
    animation: spin 1.6s linear infinite }
  .trace .label { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 700 11px/1 var(--font-ui); letter-spacing: .14em; color: var(--text-muted); animation: breatheText 1.6s ease-in-out infinite }
  @keyframes spin { to { transform: rotate(360deg) } }
  @keyframes breatheText { 0%, 100% { opacity: .45 } 50% { opacity: 1 } }

  /* ===== Ring set: built on the Figma ring (MTX 244:90070, saved as mtx/assets/svg/loading-ring.svg) ===== */
  h2 { margin: 28px 0 6px; font: 700 18px/1 var(--font-ui); text-transform: uppercase; letter-spacing: .06em }
  .rs { position: relative; width: 120px; height: 120px }
  .rg { position: absolute; inset: 5px; background: url(../mtx/assets/svg/loading-ring.svg) center / 100% 100% no-repeat; animation: spin 1.1s linear infinite }
  .rg.pr { background: var(--conic); -webkit-mask: url(../mtx/assets/svg/loading-ring.svg) center / 100% 100% no-repeat; mask: url(../mtx/assets/svg/loading-ring.svg) center / 100% 100% no-repeat }
  .rg.slow { animation-duration: 1.8s }
  .rg.step { animation: half 1.4s cubic-bezier(.7, 0, .3, 1) infinite }
  .rg.in { inset: 30px; animation: spinBack 1.4s linear infinite }
  .rs .dia { position: absolute; inset: 48px; background: var(--grad-focus); transform: rotate(45deg); animation: breathe 1.2s ease-in-out infinite }
  .rs .head { position: absolute; left: 50%; top: 5px; width: 10px; height: 10px; margin: -4px 0 0 -5px; background: var(--p1); transform: rotate(45deg) }
  .rs .grp { position: absolute; inset: 0; animation: spin 1.1s linear infinite }
  .rs .grp .rg { animation: none }
  .rs .fl { position: absolute; inset: 34px; background: var(--text-1); opacity: .5;
    -webkit-mask: url(../mtx/assets/svg/loadout/flower-thai-tile.svg) center / 100% 100% no-repeat; mask: url(../mtx/assets/svg/loadout/flower-thai-tile.svg) center / 100% 100% no-repeat; animation: breatheText 2.2s ease-in-out infinite }
  .rs .txt { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 700 12px/1 var(--font-ui); letter-spacing: .14em; color: var(--text-1); animation: breatheText 1.6s ease-in-out infinite }
  @keyframes half { from { transform: rotate(0) } to { transform: rotate(180deg) } }
  @keyframes spinBack { to { transform: rotate(-360deg) } }

  /* reduced motion: no turning or travel, only a slow opacity breath */
  @media (prefers-reduced-motion: reduce) {
    .stage *, .mini * { animation: none !important }
    .inf .dot:not(:first-of-type) { display: none }
    .rs, .inf, .turn, .chain, .blades, .flower, .orbit, .nest, .trace { animation: calm 2.4s ease-in-out infinite }
    @keyframes calm { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
  }
</style>
</head>
<body>
<main>
  <h1>Loading loops</h1>
  <p class="sub">Ring set: 8 options built on the Figma ring (MTX 244:90070). Each loop runs without a visible restart. The small row shows it at about 36 px next to text.</p>
  <div class="grid" id="ring"></div>
  <h2>Earlier set</h2>
  <p class="sub">First 8 options, without the ring.</p>
  <div class="grid" id="grid"></div>
</main>
<script>
  const P = ["var(--p1)", "var(--p2)", "var(--p3)", "var(--p4)", "var(--p5)"];
  const rep = (n, f) => Array.from({ length: n }, (_, i) => f(i)).join("");
  const R = (x = "") => `<i class="rg ${x}"></i>`;
  const RING = [
    ["1", "Ring, as in Figma", "The Figma ring in white, steady spin.", () => `<div class="rs">${R()}</div>`],
    ["2", "Prismatic ring", "Same ring filled with the Selected Prismatic colours.", () => `<div class="rs">${R("pr")}</div>`],
    ["3", "Ring + diamond core", "White ring spins, prismatic diamond breathes in the centre.", () => `<div class="rs">${R()}<i class="dia"></i></div>`],
    ["4", "Counter rings", "White outer ring, smaller prismatic ring turning the other way.", () => `<div class="rs">${R("slow")}${R("pr in")}</div>`],
    ["5", "Half-turn beat", "Ring jumps a half turn per beat with ease in and out.", () => `<div class="rs">${R("pr step")}</div>`],
    ["6", "Ring + lead diamond", "A small diamond rides the bright head of the ring.", () => `<div class="rs"><div class="grp">${R()}<i class="head"></i></div></div>`],
    ["7", "Ring + Flower Thai", "Ring spins round a faint Flower Thai mark.", () => `<div class="rs">${R("pr slow")}<i class="fl"></i></div>`],
    ["8", "Ring + label", "Ring spins round a breathing LOAD label.", () => `<div class="rs">${R()}<b class="txt">LOAD</b></div>`],
  ];
  const OPTS = [
    ["A", "Prismatic infinity", "A comet of diamonds runs a figure-eight track.",
      () => `<div class="inf"><svg viewBox="0 0 200 100" width="200" height="100"><defs><linearGradient id="g8" x1="0" x2="1"><stop offset="0" stop-color="#f3eed0"/><stop offset=".25" stop-color="#e4b996"/><stop offset=".5" stop-color="#766ab2"/><stop offset=".75" stop-color="#5a8dc2"/><stop offset="1" stop-color="#8bcab2"/></linearGradient></defs>
        <path d="M100,50 C130,12 178,12 178,50 C178,88 130,88 100,50 C70,12 22,12 22,50 C22,88 70,88 100,50 Z" fill="none" stroke="url(#g8)" stroke-width="3" opacity=".25"/></svg>
        ${rep(7, i => `<i class="dot" style="--i:${i};--c:${P[i % 5]}"></i>`)}</div>`],
    ["B", "Diamond ring turn", "Prismatic ring turns a quarter per beat, centre breathes.",
      () => `<div class="turn"><i class="ring"></i><i class="core"></i></div>`],
    ["C", "Diamond pulse chain", "Five diamonds, a wave runs left to right.",
      () => `<div class="chain">${rep(5, i => `<i style="--i:${i};--c:${P[i]}"></i>`)}</div>`],
    ["D", "Slanted blade chase", "Seven slanted blades light up in turn.",
      () => `<div class="blades">${rep(7, i => `<i style="--i:${i};--c:${P[Math.min(4, Math.floor(i * 5 / 7))]}"></i>`)}</div>`],
    ["E", "Flower Thai spin", "Loadout Flower Thai tile in prismatic colour, quarter turns with a halo.",
      () => `<div class="flower"><i class="halo"></i><i class="bloom"></i></div>`],
    ["F", "Quatrefoil orbit", "Four diamonds orbit a hollow centre.",
      () => `<div class="orbit">${rep(4, i => `<i style="--i:${i};--c:${P[i + 1]}"></i>`)}<i class="hub"></i></div>`],
    ["G", "Nested diamonds", "Three rings, outer and middle turn opposite ways.",
      () => `<div class="nest"><i class="ring r1"></i><i class="ring r2"></i><i class="ring r3"></i></div>`],
    ["H", "Diamond trace", "A prismatic light runs round a still diamond track.",
      () => `<div class="trace"><i class="track"></i><i class="ring"></i><b class="label">LOAD</b></div>`],
  ];
  const card = ([k, name, desc, html]) => `
    <article class="card" data-opt="${k}"><div class="stage">${html()}</div>
      <div class="meta"><b><i>${k}</i>${name}</b><span>${desc}</span>
        <div class="mini"><div class="box"><div class="sc">${html().replace(/id="g8"/, `id="g8${k}"`).replace(/url(#g8)/, `url(#g8${k})`)}</div></div>Loading</div></div></article>`;
  document.getElementById("ring").innerHTML = RING.map(card).join("");
  document.getElementById("grid").innerHTML = OPTS.map(([k, name, desc, html]) => `
    <article class="card" data-opt="${k}"><div class="stage">${html()}</div>
      <div class="meta"><b><i>${k}</i>${name}</b><span>${desc}</span>
        <div class="mini"><div class="box"><div class="sc">${html().replace(/id="g8"/, `id="g8${k}"`).replace(/url\(#g8\)/, `url(#g8${k})`)}</div></div>Loading</div></div></article>`).join("");
</script>
</body>
</html>
